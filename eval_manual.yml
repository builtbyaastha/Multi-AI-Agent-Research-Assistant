name: Full Eval (manual)

# This is deliberately NOT run on every push. It depends on a live Ollama
# model and the real Exa search API, which makes it slow (model pull +
# multiple full pipeline runs), costs real CI minutes, and can be flaky due
# to external service availability — none of which belong in a fast,
# always-green push check. Trigger it manually before a release, or on a
# schedule, not on every commit.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"  # weekly, Monday 03:00 UTC

jobs:
  full-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull mistral
        run: |
          ollama serve &
          sleep 5
          ollama pull mistral

      - name: Run eval suite
        run: uv run python eval.py --limit 2 --save eval-results.json
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results.json