name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run deterministic unit tests
        run: uv run pytest tests/test_guards.py -v
        env:
          # tools.py / agents.py instantiate Exa/ChatOllama clients at import
          # time; they don't make network calls until actually invoked, but
          # Exa() raises if the key is completely absent, so provide a dummy
          # value — no real API call happens in these tests.
          EXA_API_KEY: "dummy-key-for-ci-import-only"